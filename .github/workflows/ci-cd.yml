name: MLOps Pipeline with MLflow
on:
  push:
    branches: [ main ]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test model
        run: python src/test_model.py


  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/diabetes-api:latest" >> $GITHUB_ENV

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run:
          docker build -f app/api/Dockerfile -t $IMAGE_NAME app/

      - name: Push Docker image
        run:
          docker push $IMAGE_NAME

      - name: Start container
        run: |
          docker run -d \
            --name diabetes-api \
            -p 8000:8000 \
            $IMAGE_NAME

      - name: Wait API
        run:
          sleep 15


      - name: List containers
        run: 
          docker ps -a

      - name: Container logs
        run: 
          docker logs diabetes-api

      - name: Smoke test
        run:
          curl --fail http://localhost:8000/health