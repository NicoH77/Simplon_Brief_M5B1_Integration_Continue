name: MLOps Pipeline with MLflow
on:
  push:
    branches: [ main ]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test model
        run: python src/test_model.py


  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run:
          docker build -t ghcr.io/${{ github.repository }}/diabetes-api:latest .

      - name: Push Docker image
        run:
          docker push ghcr.io/${{ github.repository }}/diabetes-api:latest

      - name: Start container
        run:
          docker run -d \
            --name diabetes-api \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}/diabetes-api:latest

      - name: Wait API
        run:
          sleep 15

      - name: Smoke test
        run:
          curl --fail http://localhost:8000/health